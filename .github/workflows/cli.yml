name: CLI

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [main, 'sdk-*']
    paths:
    - .github/workflows/cli.yml
    - apps/router-e2e/**
    - packages/@expo/cli/**
    - packages/@expo/metro-runtime/**
    - packages/@expo/metro-config/src/**
    - packages/@expo/config/src/**
    - packages/@expo/config-plugins/src/**
    - packages/@expo/env/src/**
    - packages/@expo/json-file/src/**
    - packages/@expo/package-manager/src/**
    - packages/@expo/prebuild-config/src/**
    - packages/@expo/router-server/**
    - packages/@expo/log-box/**
    - packages/@expo/metro-file-map/**
    - packages/eslint-config-expo/**
    - packages/eslint-plugin-expo/**
    - packages/expo-router/**
    - packages/expo-server/**
    - '!**.md'
  pull_request:
    paths:
    - .github/workflows/cli.yml
    - apps/router-e2e/**
    - packages/@expo/cli/**
    - packages/@expo/metro-runtime/**
    - packages/@expo/metro-config/src/**
    - packages/@expo/config/src/**
    - packages/@expo/config-plugins/src/**
    - packages/@expo/env/src/**
    - packages/@expo/json-file/src/**
    - packages/@expo/package-manager/src/**
    - packages/@expo/prebuild-config/src/**
    - packages/@expo/router-server/**
    - packages/@expo/log-box/**
    - packages/@expo/metro-file-map/**
    - packages/eslint-config-expo/**
    - packages/eslint-plugin-expo/**
    - packages/expo-router/**
    - packages/expo-server/**
    - '!**.md'

concurrency:
  group: ${{ github.workflow }}-${{ 'push' }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  # JS-only jobs, so skip the ~685 MB @shopify/react-native-skia prebuilt-binary download.
  SKIP_SKIA_DOWNLOAD: '1'

permissions:
  contents: read
  id-token: write

run-name: "CLI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  jest-ubuntu:
    if: ${{ 'push' != 'schedule' || github.repository == 'expo/expo' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - name: 👀 Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 100
    - name: ⬇️ Fetch commits from base branch
      run: git fetch origin ${{ github.event.before || github.base_ref || 'main' }}:${{ github.event.before || github.base_ref || 'main' }} --depth 100
      if: ${{ 'push' == 'pull_request' || 'push' == 'workflow_dispatch' }}

    - name: 🏗️ Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271   # v6.0.9
      with:
        version: 10

    - name: 🏗️ Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
      with:
        node-version: 24
        cache: 'pnpm'

    - name: 🏗️ Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6   # v2.2.0
      with:
        bun-version: '1.x'

    - name: 📦 Install node modules in root dir
      run: pnpm install --frozen-lockfile
      env:
        TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        TURBO_TEAM: expo

    - name: 🔎 Type Check CLI
      working-directory: packages/@expo/cli
      run: pnpm typecheck

    - name: 🧪 E2E Test CLI
      working-directory: packages/@expo/cli
      run: pnpm test:e2e --max-workers 1 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  playwright-ubuntu:
    if: ${{ 'push' != 'schedule' || github.repository == 'expo/expo' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - name: 👀 Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 100
    - name: ⬇️ Fetch commits from base branch
      run: git fetch origin ${{ github.event.before || github.base_ref || 'main' }}:${{ github.event.before || github.base_ref || 'main' }} --depth 100
      if: ${{ 'push' == 'pull_request' || 'push' == 'workflow_dispatch' }}

    - name: 🏗️ Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271   # v6.0.9
      with:
        version: 10

    - name: 🏗️ Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
      with:
        node-version: 24
        cache: 'pnpm'

    - name: 🏗️ Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6   # v2.2.0
      with:
        bun-version: '1.x'

    - name: 📦 Install node modules in root dir
      run: pnpm install --frozen-lockfile
      env:
        TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        TURBO_TEAM: expo

    - name: 🎭 Get Playwright information
      id: playwright-info
      shell: bash
      working-directory: packages/@expo/cli
      run: |
        echo version="$(pnpm exec playwright --version)" >> $GITHUB_OUTPUT
    - name: 🎭 Cache Playwright browser binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      id: playwright-browser-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-info.outputs.version }}
    - name: 🎭 Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium
      working-directory: packages/@expo/cli
      if: steps.playwright-browser-cache.outputs.cache-hit != 'true'

    - name: 🧪 E2E (playwright) Test CLI
      working-directory: packages/@expo/cli
      run: pnpm test:playwright --shard ${{ matrix.shard }}/${{ strategy.job-total }}

    - name: 🗄️ Upload playwright report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      if: always()
      with:
        name: playwright-report-ubuntu-${{ matrix.shard }}
        path: packages/@expo/cli/playwright-report/
        retention-days: 30

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
